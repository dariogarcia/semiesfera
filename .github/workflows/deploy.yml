name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    # reconstrucción diaria para liberar historias en su fecha de publicación
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: node build.mjs
      - name: Smoke test
        run: node tools/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar si Pages está disponible
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages no está habilitado (repositorio privado sin plan compatible)."
            echo "El sitio se puede servir en local con: npm run build && npm run serve"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.pages_check.outputs.available == 'true'
        uses: actions/deploy-pages@v4
